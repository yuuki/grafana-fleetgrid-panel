# Version updates arrive weekly, grouped, and only after a release has been public for a week
# (compromised releases are usually pulled within days). Security updates are not delayed by
# this schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: 'weekly'
    # Wait 7 days before updating to help circumvent supply chain attacks
    cooldown:
      default-days: 7
      # Exclude plugin-e2e to prevent false positives with canary e2e tests
      exclude:
        - '@grafana/plugin-e2e'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'build'
      include: 'scope'
    # Updates that cannot be installed or that break the build. Remove a rule when its reason
    # no longer holds.
    ignore:
      # The plugin supports Grafana 11.6 and later (React 18) and builds against @grafana/* 12.x
      # (docs/design.md, section 11). The 13.2 and later packages need React 19.
      - dependency-name: '@grafana/data'
        update-types: ['version-update:semver-major']
      - dependency-name: '@grafana/runtime'
        update-types: ['version-update:semver-major']
      - dependency-name: '@grafana/schema'
        update-types: ['version-update:semver-major']
      - dependency-name: '@grafana/ui'
        update-types: ['version-update:semver-major']
      - dependency-name: '@grafana/i18n'
        versions: ['>=13.2.0']
      # Version 10 has no flat.js, which .config/eslint.config.mjs (managed by
      # @grafana/create-plugin) imports. Update it together with the scaffold.
      - dependency-name: '@grafana/eslint-config'
        update-types: ['version-update:semver-major']
      # eslint-plugin-react 7.37.5 (the latest release) supports ESLint 9 at most.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
    groups:
      unit-test:
        patterns:
          - '@testing-library/*'
          - 'jest*'
          - '@types/jest'
          - 'fast-check'
      eslint:
        patterns:
          - '@grafana/eslint-config'
          - 'eslint*'
          - '@typescript-eslint/*'
          - '@stylistic/*'
      grafana:
        patterns:
          - '@grafana/*'
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
        update-types:
          - 'minor'
          - 'patch'
      # Everything not matched above, except major versions, which keep their own pull request
      # (a dependency joins the first group that matches it).
      other:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'ci'
      include: 'scope'
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'
